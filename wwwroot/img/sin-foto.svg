<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Producto sin foto">
  <!-- Dibujo de un tornillo para los productos que todavía no tienen foto.
       Fondo transparente: toma el color de la tarjeta donde se ponga. -->
  <defs>
    <linearGradient id="cabeza" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c99600"/>
      <stop offset=".45" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#b38500"/>
    </linearGradient>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c5c5c"/>
      <stop offset=".45" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#4a4a4a"/>
    </linearGradient>
    <clipPath id="vastago">
      <path d="M86 70 H114 V150 L100 176 L86 150 Z"/>
    </clipPath>
  </defs>

  <!-- Sombra en el piso -->
  <ellipse cx="100" cy="184" rx="58" ry="7" fill="#000" opacity=".35"/>

  <g transform="rotate(-28 100 110)">
    <!-- Vástago con rosca -->
    <path d="M86 70 H114 V150 L100 176 L86 150 Z" fill="url(#cuerpo)"/>
    <g clip-path="url(#vastago)" stroke="#2b2b2b" stroke-width="4" opacity=".75">
      <line x1="80" y1="78" x2="120" y2="70"/>
      <line x1="80" y1="92" x2="120" y2="84"/>
      <line x1="80" y1="106" x2="120" y2="98"/>
      <line x1="80" y1="120" x2="120" y2="112"/>
      <line x1="80" y1="134" x2="120" y2="126"/>
      <line x1="80" y1="148" x2="120" y2="140"/>
      <line x1="80" y1="162" x2="120" y2="154"/>
    </g>

    <!-- Cabeza hexagonal, en el amarillo de la marca -->
    <path d="M66 46 L74 30 H126 L134 46 V66 Q134 72 128 72 H72 Q66 72 66 66 Z" fill="url(#cabeza)"/>
    <path d="M74 30 H126 L134 46 H66 Z" fill="#ffe27a" opacity=".55"/>
    <line x1="88" y1="46" x2="88" y2="72" stroke="#8a6700" stroke-width="2" opacity=".6"/>
    <line x1="112" y1="46" x2="112" y2="72" stroke="#8a6700" stroke-width="2" opacity=".6"/>
  </g>

  <!-- Pequeño marco de cámara: indica que falta la foto -->
  <g transform="translate(140 28)" fill="none" stroke="#f5b700" stroke-width="4" stroke-linecap="round" opacity=".8">
    <rect x="0" y="8" width="40" height="28" rx="6"/>
    <path d="M12 8 L16 1 H24 L28 8"/>
    <circle cx="20" cy="22" r="7"/>
    <line x1="-4" y1="40" x2="44" y2="4"/>
  </g>
</svg>
