<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Arandela sin foto">
  <!-- Arandela plana vista en perspectiva, para productos sin foto. Fondo transparente. -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9d9d9"/>
      <stop offset=".5" stop-color="#9a9a9a"/>
      <stop offset="1" stop-color="#5c5c5c"/>
    </linearGradient>
  </defs>
  <ellipse cx="100" cy="176" rx="62" ry="8" fill="#000" opacity=".35"/>
  <!-- Grosor -->
  <path fill-rule="evenodd" fill="#4a4a4a"
        d="M30 122 a70 40 0 1 0 140 0 a70 40 0 1 0 -140 0 Z M74 122 a26 14 0 1 0 52 0 a26 14 0 1 0 -52 0 Z" transform="translate(0 10)"/>
  <!-- Cara -->
  <path fill-rule="evenodd" fill="url(#metal)"
        d="M30 122 a70 40 0 1 0 140 0 a70 40 0 1 0 -140 0 Z M74 122 a26 14 0 1 0 52 0 a26 14 0 1 0 -52 0 Z"/>
  <path d="M42 112 a62 32 0 0 1 116 0" fill="none" stroke="#fff" stroke-width="3" opacity=".35"/>
  <!-- Borde del hueco en el amarillo de la marca -->
  <ellipse cx="100" cy="122" rx="26" ry="14" fill="none" stroke="#f5b700" stroke-width="3"/>
  <g transform="translate(140 28)" fill="none" stroke="#f5b700" stroke-width="4" stroke-linecap="round" opacity=".8">
    <rect x="0" y="8" width="40" height="28" rx="6"/><path d="M12 8 L16 1 H24 L28 8"/><circle cx="20" cy="22" r="7"/><line x1="-4" y1="40" x2="44" y2="4"/>
  </g>
</svg>
