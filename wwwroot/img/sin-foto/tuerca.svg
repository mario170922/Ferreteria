<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Tuerca sin foto">
  <!-- Tuerca hexagonal, para productos sin foto. Fondo transparente. -->
  <defs>
    <linearGradient id="cara" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset=".5" stop-color="#f5b700"/>
      <stop offset="1" stop-color="#b38500"/>
    </linearGradient>
    <radialGradient id="hueco" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#3a3a3a"/>
    </radialGradient>
  </defs>
  <ellipse cx="100" cy="182" rx="56" ry="7" fill="#000" opacity=".35"/>
  <!-- Canto de la tuerca (da volumen) -->
  <path d="M52 112 L76 70 H124 L148 112 L124 154 H76 Z" transform="translate(0 12)" fill="#8a6700"/>
  <!-- Cara -->
  <path d="M52 112 L76 70 H124 L148 112 L124 154 H76 Z" fill="url(#cara)"/>
  <path d="M52 112 L76 70 H124 L100 112 Z" fill="#fff" opacity=".18"/>
  <!-- Hueco con rosca -->
  <circle cx="100" cy="112" r="24" fill="url(#hueco)"/>
  <circle cx="100" cy="112" r="24" fill="none" stroke="#8a6700" stroke-width="4"/>
  <circle cx="100" cy="112" r="17" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="4 4"/>
  <g transform="translate(140 28)" fill="none" stroke="#f5b700" stroke-width="4" stroke-linecap="round" opacity=".8">
    <rect x="0" y="8" width="40" height="28" rx="6"/><path d="M12 8 L16 1 H24 L28 8"/><circle cx="20" cy="22" r="7"/><line x1="-4" y1="40" x2="44" y2="4"/>
  </g>
</svg>
