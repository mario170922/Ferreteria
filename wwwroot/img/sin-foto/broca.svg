<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Broca sin foto">
  <!-- Broca para taladro, para productos sin foto. Fondo transparente. -->
  <defs>
    <linearGradient id="acero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c5c5c"/>
      <stop offset=".45" stop-color="#b8b8b8"/>
      <stop offset="1" stop-color="#4a4a4a"/>
    </linearGradient>
    <linearGradient id="punta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c99600"/>
      <stop offset=".45" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#a87d00"/>
    </linearGradient>
    <clipPath id="estrias"><path d="M90 92 H110 V160 L100 180 L90 160 Z"/></clipPath>
  </defs>
  <ellipse cx="100" cy="186" rx="56" ry="7" fill="#000" opacity=".35"/>
  <g transform="rotate(-30 100 110)">
    <!-- Vástago liso -->
    <rect x="91" y="24" width="18" height="70" rx="3" fill="url(#acero)"/>
    <!-- Parte con estrías, recubierta en amarillo (tipo titanio) -->
    <path d="M90 92 H110 V160 L100 180 L90 160 Z" fill="url(#punta)"/>
    <g clip-path="url(#estrias)" stroke="#6b5000" stroke-width="5" fill="none">
      <path d="M86 100 L114 88"/><path d="M86 118 L114 106"/><path d="M86 136 L114 124"/>
      <path d="M86 154 L114 142"/><path d="M86 172 L114 160"/>
    </g>
  </g>
  <g transform="translate(140 28)" fill="none" stroke="#f5b700" stroke-width="4" stroke-linecap="round" opacity=".8">
    <rect x="0" y="8" width="40" height="28" rx="6"/><path d="M12 8 L16 1 H24 L28 8"/><circle cx="20" cy="22" r="7"/><line x1="-4" y1="40" x2="44" y2="4"/>
  </g>
</svg>
