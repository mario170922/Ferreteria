<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Puntilla sin foto">
  <!-- Puntilla (clavo), para productos sin foto. Fondo transparente. -->
  <defs>
    <linearGradient id="acero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c5c5c"/>
      <stop offset=".45" stop-color="#bdbdbd"/>
      <stop offset="1" stop-color="#4a4a4a"/>
    </linearGradient>
    <linearGradient id="cabeza" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c99600"/>
      <stop offset=".45" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#b38500"/>
    </linearGradient>
  </defs>
  <ellipse cx="100" cy="186" rx="56" ry="7" fill="#000" opacity=".35"/>
  <g transform="rotate(-30 100 110)">
    <!-- Cabeza plana -->
    <ellipse cx="100" cy="34" rx="22" ry="7" fill="url(#cabeza)"/>
    <rect x="78" y="34" width="44" height="5" fill="#8a6700"/>
    <ellipse cx="100" cy="39" rx="22" ry="5" fill="#8a6700"/>
    <!-- Cuerpo largo y delgado con punta -->
    <path d="M94 42 H106 V160 L100 184 L94 160 Z" fill="url(#acero)"/>
    <g stroke="#3a3a3a" stroke-width="2" opacity=".6">
      <line x1="94" y1="48" x2="106" y2="46"/><line x1="94" y1="54" x2="106" y2="52"/><line x1="94" y1="60" x2="106" y2="58"/>
    </g>
  </g>
  <g transform="translate(140 28)" fill="none" stroke="#f5b700" stroke-width="4" stroke-linecap="round" opacity=".8">
    <rect x="0" y="8" width="40" height="28" rx="6"/><path d="M12 8 L16 1 H24 L28 8"/><circle cx="20" cy="22" r="7"/><line x1="-4" y1="40" x2="44" y2="4"/>
  </g>
</svg>
